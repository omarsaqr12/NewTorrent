[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newtorrent"
version = "0.2.0"
description = "Bounded, resumable BitTorrent v1 download engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "hypothesis>=6,<7"]
bench = ["psutil>=5.9,<8", "matplotlib>=3.7,<4"]
interop = ["libtorrent>=2.0,<3"]

[project.scripts]
newtorrent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
