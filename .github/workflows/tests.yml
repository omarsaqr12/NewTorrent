name: Python regression tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app benchmark.py tests
      - name: Run documented offline quickstart
        run: |
          python -m app.main info sample.torrent
          test "$(python -m app.main decode 'd3:foo3:bare')" = '{"foo": "bar"}'
      - name: Run offline protocol and download regression tests
        run: python -m unittest discover -s tests -v
